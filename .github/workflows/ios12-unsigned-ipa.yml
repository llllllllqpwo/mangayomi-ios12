# =============================================================================
#  Mangayomi v0.5.0  ->  iOS 12.5 未签名 IPA   （GitHub Actions，无需 Mac）
# =============================================================================
#  放到你的 fork：  <repo>/.github/workflows/ios12-unsigned-ipa.yml
#
#  前置（缺一不可）：
#    1) fork 必须【公开】(public)：公开仓库的 Actions 免费且不限量；
#       私有仓库的 macOS runner 会按分钟计费。
#    2) 基于 tag v0.5.0 建一个分支，例如  ios12-unsigned-ipa
#
#  它做了什么：
#    - 用 macos-15 runner（预装 Xcode 16.x —— 能编 iOS 12；Xcode 26 不行）
#    - Flutter 钉在 3.27.4（引擎 minos = 12.0）—— 【切勿】用 latest/stable
#    - 把 ios/Podfile 自动改成 platform :ios, '12.0' + post_install 兜底
#    - rustup add aarch64-apple-ios（cargokit 构建 rust_lib_mangayomi 用）
#    - flutter build ios --release --no-codesign
#    - 手工打 Payload/*.ipa（未签名，供 AltStore/Sideloadly/爱思助手 签名安装）
#    - vtool 校验产物里每个 Mach-O 的真实 minos，> 12.5.7 直接让 CI 失败
#    - 上传 IPA 为 artifact
#
#  结果：Actions 页面 -> 该次 run -> Artifacts -> Mangayomi-ios12-unsigned-ipa
# =============================================================================

name: iOS 12 unsigned IPA (Mangayomi v0.5.0 backport)

on:
  # 手动触发（推荐）
  workflow_dispatch:
  # 推到该分支时自动触发；改成你自己的分支名即可
  push:
    branches:
      - ios12-unsigned-ipa

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 关键：3.27.x 是最后一个引擎 minos=12.0 的 Flutter 系列（Dart 3.6.x / 匹配 v0.5.0）
  FLUTTER_VERSION: "3.27.4"
  # 目标最低系统版本
  IOS_MIN: "12.0"
  # 产物里允许的最大 minos（iPad Air 1 实际 OS = 12.5.7）
  IOS_MAX_ALLOWED: "12.5.7"

jobs:
  build-ios12-ipa:
    name: Build unsigned iOS 12 IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------------------
      - name: Show toolchain versions
        run: |
          echo "----- macOS -----";        sw_vers
          echo "----- Xcode -----";        xcodebuild -version
          echo "----- iOS SDK -----";      xcrun --sdk iphoneos --show-sdk-version
          echo "----- CocoaPods -----";    pod --version
          echo "----- Ruby -----";         ruby --version

      # Xcode 26 起最低部署目标被抬到 iOS 15，无法编 iOS 12。这里硬性拦一道。
      - name: Guard - Xcode must be able to target iOS 12
        run: |
          set -euo pipefail
          VER="$(xcodebuild -version | awk '/^Xcode/{print $2}')"
          MAJ="${VER%%.*}"
          echo "Xcode version = $VER (major=$MAJ)"
          if [ "$MAJ" -ge 26 ]; then
            echo "::error::Xcode $VER cannot target iOS 12 (Xcode 26 minimum is iOS 15)."
            echo "::error::Pin the runner to macos-15 (Xcode 16.x) or select an Xcode 16 image."
            exit 1
          fi

      # ---------------------------------------------------------------------
      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Flutter version (must be 3.27.x)
        run: |
          set -euo pipefail
          flutter --version
          V="$(flutter --version --machine 2>/dev/null | sed -n 's/.*"frameworkVersion": *"\([^"]*\)".*/\1/p' || true)"
          echo "frameworkVersion=$V"
          case "$V" in
            3.27.*) echo "OK: Flutter $V can target iOS 12";;
            "")     echo "::warning::Could not parse frameworkVersion; continuing.";;
            *)      echo "::error::Flutter $V is not 3.27.x. Newer engines require iOS 13+."; exit 1;;
          esac

      - name: Setup Rust + iOS device target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Confirm rust target present
        run: |
          set -euo pipefail
          rustup target list --installed > "$RUNNER_TEMP/rust-targets.txt"
          cat "$RUNNER_TEMP/rust-targets.txt"
          grep -q aarch64-apple-ios "$RUNNER_TEMP/rust-targets.txt"

      # ---------------------------------------------------------------------
      # 核心：把 Podfile 换成 iOS 12 版本（幂等，覆盖式写入，不依赖仓库是否已改过）
      - name: Patch ios/Podfile -> platform :ios, '12.0'
        run: |
          set -euo pipefail
          test -f ios/Podfile.bak.ios12 || cp ios/Podfile ios/Podfile.bak.ios12
          cat > ios/Podfile <<'PODFILE'
          # === MangaYomi v0.5.0 -> iOS 12.5 backport Podfile (auto-generated by CI) ===

          platform :ios, '12.0'

          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. If you're running pod install manually, make sure flutter pub get is executed first"
            end

            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}. Try deleting Generated.xcconfig, then run flutter pub get"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

          flutter_ios_podfile_setup

          target 'Runner' do
            use_frameworks!
            use_modular_headers!

            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)

              # ---- iOS 12 backport: force每个 pod target 的部署目标 ----
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '12.0'
              end
              # ---- end ----
            end

            # ---- iOS 12 backport: force Pods 工程本身 ----
            installer.pods_project.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '12.0'
            end
            # ---- end ----
          end
          PODFILE
          echo "----- ios/Podfile (head) -----"
          head -n 6 ios/Podfile
          grep -n "platform :ios" ios/Podfile

      # 幂等兜底：把 pbxproj 里任何 >=13.0 的部署目标压回 12.0（v0.5.0 本来就已是 12.0）
      - name: Normalize pbxproj deployment target (idempotent)
        run: |
          set -euo pipefail
          PBX=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = 1[3-9]\.[0-9]+;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g" "$PBX"
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" "$PBX" || true

      # ---------------------------------------------------------------------
      - name: flutter pub get  (respects committed pubspec.lock)
        run: flutter pub get

      - name: Verify locked git deps did not drift
        run: |
          set -euo pipefail
          echo "--- flutter_qjs / media_kit / desktop_webview_window resolved refs ---"
          grep -nE "resolved-ref" pubspec.lock | head -n 20 || true
          # flutter_qjs 必须仍是 6b70858b...（v0.5.0 lock 值）
          if ! grep -q "6b70858b18d53203f5024edd7e24fee4af8b921a" pubspec.lock; then
            echo "::warning::flutter_qjs resolved-ref changed; the pinned commit 6b70858b... not found."
          fi

      - name: pod install
        working-directory: ios
        run: pod install --repo-update

      # ---------------------------------------------------------------------
      - name: Build iOS release (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Assert Runner.app exists
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP" || { echo "::error::Runner.app not found at $APP"; exit 1; }
          ls -la "$APP" | head -n 20

      # ---------------------------------------------------------------------
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          rm -rf Payload Mangayomi-ios12-unsigned.ipa
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          # 未签名 IPA：普通 zip，外层必须是 Payload/ 目录
          zip -qry Mangayomi-ios12-unsigned.ipa Payload
          rm -rf Payload
          ls -lh Mangayomi-ios12-unsigned.ipa
          unzip -l Mangayomi-ios12-unsigned.ipa | head -n 15

      # ---------------------------------------------------------------------
      # 真正的正确性判据：查每个 Mach-O 内部的 minos（podspec 只声明，不担保二进制）
      - name: Verify minimum OS (vtool) of every Mach-O
        run: |
          # GitHub 的 macOS 默认 shell 是 `bash -e -o pipefail`；
          # 本步骤要「累积失败」而不是「遇错即退」，所以显式关掉 -e。
          set +e -uo pipefail
          APP=build/ios/iphoneos/Runner.app
          MAX="${{ env.IOS_MAX_ALLOWED }}"
          to_num() { printf '%s' "$1" | awk -F. '{printf "%d%03d%03d",$1,$2,$3}'; }
          MAX_N="$(to_num "$MAX")"
          fail=0
          check() {
            local bin="$1" min n
            [ -f "$bin" ] || return 0
            min="$(vtool -show-build "$bin" 2>/dev/null | awk '/minos/{print $2; exit}')"
            [ -z "$min" ] && { echo "  [skip] no minos  $bin"; return 0; }
            n="$(to_num "$min")"
            if [ "$n" -gt "$MAX_N" ]; then
              echo "  [FAIL] minos=$min (> $MAX)  $bin"; fail=1
            else
              echo "  [ok]   minos=$min  $bin"
            fi
          }
          echo "== main executable =="
          check "$APP/Runner"
          echo "== embedded frameworks / dylibs =="
          shopt -s nullglob
          for fw in "$APP"/Frameworks/*.framework; do
            check "$fw/$(basename "$fw" .framework)"
          done
          for dy in "$APP"/Frameworks/*.dylib; do
            check "$dy"
          done
          echo "== all Mach-O under Runner.app =="
          while IFS= read -r f; do
            file "$f" | grep -q 'Mach-O' && check "$f"
          done < <(find "$APP" -type f)
          if [ "$fail" -ne 0 ]; then
            echo "::error::At least one Mach-O has minos > $MAX and will NOT load on iOS 12.5.7."
            exit 1
          fi
          echo "ALL OK: every Mach-O minos <= $MAX"

      # ---------------------------------------------------------------------
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mangayomi-ios12-unsigned-ipa
          path: build/ios/iphoneos/Mangayomi-ios12-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios12-build-logs
          path: |
            ios/Podfile
            ios/Podfile.lock
            ios/Runner.xcodeproj/project.pbxproj
          if-no-files-found: warn